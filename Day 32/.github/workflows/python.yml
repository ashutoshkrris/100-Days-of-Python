name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Day 32
        run: python "Day 32/main.py"
